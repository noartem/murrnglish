# CI/CD: every book's data validation, unit tests, build, then publish dist/
# to GitHub Pages.
#
# Pages is fed by the artifact of the build job (actions/upload-pages-artifact),
# never by a committed branch, so the custom domain in public/CNAME travels with
# the build and no gh-pages branch can drift out of sync with it.

name: CI & Pages deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'pages' || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: npm ci

      - name: Validate parsed data (every book)
        run: |
          for v in books/*/scripts/validate.py; do
            echo "::group::$v"
            python "$v"
            echo "::endgroup::"
          done

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4