# CI/CD: every book's data validation, unit tests, build, then publish dist/
# to the VPS.
#
# Publishing needs repo secret DEPLOY_SSH_KEY — the private ed25519 deploy key
# whose public part is installed for the deploy user on the VPS (see
# scripts/deploy.sh for host, user and path). Without the secret the workflow
# still validates, tests and builds, and skips the publish step.

name: CI & VPS deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'deploy-vps' || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate, test, build, publish
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: npm ci

      - name: Validate parsed data (every book)
        run: |
          for v in books/*/scripts/validate.py; do
            echo "::group::$v"
            python "$v"
            echo "::endgroup::"
          done

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Write deploy key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_DEPLOY_KEY == 'true'
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"

      - name: Publish to VPS
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_DEPLOY_KEY == 'true'
        run: bash scripts/deploy.sh
        env:
          DEPLOY_KEY: ${{ runner.temp }}/deploy_key
