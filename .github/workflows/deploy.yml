# CI/CD: tests + data validation, then deploy the app to GitHub Pages.
#
# Pages source must be set to "GitHub Actions" once in repo settings
# (Settings -> Pages -> Build and deployment -> Source).

name: CI & Pages deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: npm ci
        working-directory: app

      - name: Validate parsed data
        run: python scripts/validate.py

      - name: Unit tests
        run: npm test
        working-directory: app

      - name: Build (base = /<repo>/)
        run: npm run build -- --base="/${GITHUB_REPOSITORY#*/}/"
        working-directory: app

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
