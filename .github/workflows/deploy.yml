# CI/CD: data validation, unit tests, build, then publish app/dist to the VPS.
#
# Requires repo secret DEPLOY_SSH_KEY — the private ed25519 deploy key whose
# public part is installed for rm-deploy on the VPS (84.54.30.169).
#
# Note: GitHub Pages deploy was replaced by the VPS (red-murphy.noartem.ru,
# Caddy). Settings -> Pages can be switched back to "Disabled" at any time.

name: CI & VPS deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate, test, build, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: npm ci
        working-directory: app

      - name: Validate parsed data
        run: python scripts/validate.py

      - name: Unit tests
        run: npm test
        working-directory: app

      - name: Build
        run: npm run build
        working-directory: app

      - name: Write deploy key
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"

      - name: Publish to VPS
        run: bash scripts/deploy.sh
        env:
          DEPLOY_KEY: ${{ runner.temp }}/deploy_key
